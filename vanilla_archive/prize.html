<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumil – Prize & Spin</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#FFD700;--gold-lt:#FFF4CC;--dark:#0A0D20;--brown:#222856;--maroon:#4B4F71;--gold-dk:#B8860B;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--dark);}

/* ═══ BG ═══ */
.hero{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 100% 80% at 50% 20%, #4B4F71 0%, #222856 35%, #111838 70%, #0A0D20 100%);
}
.hero-bg::before { display: none; }
.hero-bg::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
}
.rays { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
.rays::before {
  content: ''; position: absolute; top: 0; left: 50%; width: 280%; height: 280%;
  transform: translate(-50%, -30%);
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255,215,0,0.15) 3deg, transparent 6deg, transparent 20deg, rgba(255,215,0,0.10) 23deg, transparent 26deg, transparent 40deg, rgba(255,215,0,0.15) 43deg, transparent 46deg, transparent 60deg, rgba(255,215,0,0.10) 63deg, transparent 66deg, transparent 80deg, rgba(255,215,0,0.15) 83deg, transparent 86deg, transparent 100deg, rgba(255,215,0,0.10) 103deg, transparent 106deg, transparent 120deg, rgba(255,215,0,0.15) 123deg, transparent 126deg, transparent 140deg, rgba(255,215,0,0.10) 143deg, transparent 146deg, transparent 160deg, rgba(255,215,0,0.15) 163deg, transparent 166deg, transparent 180deg, rgba(255,215,0,0.10) 183deg, transparent 186deg, transparent 200deg, rgba(255,215,0,0.15) 203deg, transparent 206deg, transparent 220deg, rgba(255,215,0,0.10) 223deg, transparent 226deg, transparent 240deg, rgba(255,215,0,0.15) 243deg, transparent 246deg, transparent 260deg, rgba(255,215,0,0.10) 263deg, transparent 266deg, transparent 280deg, rgba(255,215,0,0.15) 283deg, transparent 286deg, transparent 300deg, rgba(255,215,0,0.10) 303deg, transparent 306deg, transparent 320deg, rgba(255,215,0,0.15) 323deg, transparent 326deg, transparent 340deg, rgba(255,215,0,0.10) 343deg, transparent 346deg, transparent 360deg);
  animation: spinRays 80s linear infinite;
}
@keyframes spinRays { to { transform: translate(-50%, -30%) rotate(360deg); } }
.fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.cf{position:absolute;top:-20px;animation:cfFall linear infinite;opacity:0;}
@keyframes cfFall{0%{transform:translateY(-30px) rotate(0deg);opacity:0;}8%{opacity:1;}92%{opacity:.7;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
.sp{position:absolute;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--gold-lt);animation:twk ease-in-out infinite;}
@keyframes twk{0%,100%{opacity:.1;transform:scale(.6) rotate(0);}50%{opacity:1;transform:scale(1.6) rotate(20deg);}}

/* ═══ HOME BTN — golden ═══ */
.home-btn{
  position:fixed;top:14px;left:14px;z-index:200;
  display:flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,#D4A017,#FF8F00);
  border:none;border-radius:50px;
  padding:9px 20px 9px 14px;
  color:#020A1A;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1.5px;
  text-decoration:none;
  box-shadow:0 4px 18px rgba(212,160,23,.55),0 0 30px rgba(212,160,23,.2);
  transition:all .22s ease;
}
.home-btn:hover{background:linear-gradient(135deg,#FFD700,#FF6B00);transform:translateX(-3px) scale(1.05);box-shadow:0 6px 28px rgba(212,160,23,.75);}
.home-btn svg{width:16px;height:16px;fill:#020A1A;}

/* ═══ CONTENT ═══ */
.content{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:8px 16px 10px;}

/* ═══ SPIN TRANSITION (CINEMATIC FOCUS) ═══ */
.header-logos, .prize-img-wrap, .divider, .home-btn-wrap { transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; }
body.spin-mode .header-logos, body.spin-mode .prize-img-wrap, body.spin-mode .divider, body.spin-mode .home-btn-wrap {
  opacity: 0; transform: scale(0.9) translateY(-20px); height: 0 !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; pointer-events: none; border: none;
}
.card-zone { transition: min-height 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
body.spin-mode .card-zone { min-height: 85vh; }
.wheel-outer-wrap { transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
body.spin-mode .wheel-outer-wrap { transform: scale(1.4) translateY(-3vh); }

/* ═══ LOGOS ═══ */
.header-logos{width:100%;max-width:960px;display:flex;justify-content:center;align-items:center;}
.logo-left{height:clamp(60px,10vw,90px);object-fit:contain;padding:15px;background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,rgba(255,215,0,.4) 30%,transparent 65%);animation:logoPulse 3.5s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 15px rgba(255,215,0,.6));transform:scale(1);}50%{filter:drop-shadow(0 0 35px rgba(255,215,0,.9)) drop-shadow(0 0 60px rgba(255,215,0,.5));transform:scale(1.03);}}

/* ═══ PRIZE IMAGE (no text labels) ═══ */
.prize-img-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.prize-img{
  width:clamp(500px,100vw,550px);
  object-fit:contain;
  mix-blend-mode:lighten;
  filter:drop-shadow(0 12px 36px rgba(0,0,0,.8)) drop-shadow(0 0 24px rgba(212,160,23,.35));
  animation:floatUp 3.5s ease-in-out infinite;
}
@keyframes floatUp{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}

/* ═══ DIVIDER ═══ */
.divider{display:flex;align-items:center;width:100%;max-width:560px;gap:10px;}
.div-line{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.8),transparent);box-shadow:0 0 8px rgba(255,215,0,.4);}
.div-txt{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;letter-spacing:4px;color:#FFF;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 10px rgba(255,215,0,.8),0 0 20px rgba(255,215,0,.4);}

/* ═══ CARD ZONE ═══ */
.card-zone{position:relative;width:100%;max-width:340px;flex-shrink:0;display:flex;align-items:center;justify-content:center;min-height:clamp(190px,26vh,270px);}

/* ── NEW SPIN ACTION AREA ── */
.spin-action-area { display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; padding: 10px; }
.floating-prize-img { width:clamp(130px,18vw,180px); height:clamp(130px,18vw,180px); object-fit: contain; filter: drop-shadow(0 15px 25px rgba(255,215,0,0.3)); animation: floatImg 3.5s ease-in-out infinite; margin-bottom: 5px; mix-blend-mode:lighten; transition: transform 0.3s, filter 0.3s; }
@keyframes floatImg { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 15px 25px rgba(255,215,0,0.3)); } 50% { transform: translateY(-12px); filter: drop-shadow(0 25px 35px rgba(255,215,0,0.5)); } }
.spin-text-top { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; color: #E8B936; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4); text-transform: uppercase; margin-bottom: -5px; }
.spin-text-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; color: #D4AF37; letter-spacing: 3px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
.spin-text-sub .line { width: 30px; height: 1px; background: #D4AF37; }
.spin-now-btn { margin-top: 10px; background: linear-gradient(180deg, #F9D976 0%, #E8B936 50%, #C38B1B 100%); border: 2px solid #FFF3B0; border-radius: 40px; padding: 10px 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: #111; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 215, 0, 0.5), inset 0 2px 5px rgba(255,255,255,0.8); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden; pointer-events: none; }
.spin-now-btn .arrow { font-size: 30px; line-height: 1; margin-top: -3px; }
.spin-now-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shineBtn 3s infinite; }
@keyframes shineBtn { 0% { left: -100%; } 20%, 100% { left: 200%; } }
.spin-action-area:hover .spin-now-btn { transform: scale(1.05) translateY(-3px); box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), inset 0 2px 5px rgba(255,255,255,0.8); }
.spin-action-area:active .spin-now-btn { transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
.spin-action-area:hover .floating-prize-img { transform: scale(1.1) translateY(-6px); filter: drop-shadow(0 20px 40px rgba(255,215,0,0.6)); animation: none; }

/* ═══ WHEEL ═══ */
#wheel-zone{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20;}
#wheel-zone.active{display:flex;}
.wheel-outer-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:35px;margin-left:auto;margin-right:auto;}
.wheel-halo{position:relative;display:flex;align-items:center;justify-content:center;}
.wheel-halo::before{content:'';position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(212,160,23,.18),transparent 70%);animation:halo 2s ease-in-out infinite;z-index:0;}
@keyframes halo{0%,100%{transform:scale(.95);opacity:.7;}50%{transform:scale(1.1);opacity:1;}}
.wheel-container{position:relative;width:clamp(200px,32vw,240px);height:clamp(200px,32vw,240px);cursor:pointer;z-index:1;}
.wheel-container canvas{display:block;border-radius:50%;}
.wheel-center-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 32%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #351065, #170432);
  border: 4px solid #D4A017; border-color: #FFD700 #D4A017 #B8860B #FFE680;
  color: #FFD700; font-family: 'Russo One', sans-serif; letter-spacing: 0.5px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 15; cursor: pointer;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 10px rgba(0,0,0,0.8);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, background 0.3s;
}
.wheel-center-btn::before {
  content: ''; position: absolute; inset: 2px; border-radius: 50%;
  border: 2px dotted rgba(255,255,200,0.6); animation: spinDots 10s linear infinite; pointer-events: none;
}
@keyframes spinDots { 100% { transform: rotate(360deg); } }
.wheel-center-btn:hover {
  transform: translate(-50%, -50%) scale(1.15);
  box-shadow: 0 0 40px rgba(255, 215, 0, 1), inset 0 0 15px rgba(0,0,0,0.8);
  background: radial-gradient(circle, #51189c, #170432);
}
.wheel-center-btn:active {
  transform: translate(-50%, -50%) scale(0.9);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
}
.wheel-center-btn .spin-text { font-weight: normal; font-size: clamp(12px, 3.5vw, 15px); line-height: 1.1; text-shadow: 0 0 8px rgba(255,215,0,0.8); }
.wheel-center-btn .ampersand { font-weight: normal; font-size: clamp(9px, 2.5vw, 11px); line-height: 1.1; margin: 0; color: #FFE680; }
.wheel-center-btn .win-text { font-weight: normal; font-size: clamp(12px, 3.5vw, 15px); line-height: 1.1; text-shadow: 0 0 8px rgba(255,215,0,0.8); }
.wheel-pointer{position:absolute;top:-24px;left:50%;transform:translateX(-50%);z-index:10;width:28px;height:48px;}
.wheel-pointer::before{content:'';position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:32px solid #D4A017;filter:drop-shadow(0 0 12px rgba(255,200,0,.9)) drop-shadow(0 0 24px rgba(255,120,0,.6));}
.wheel-pointer::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#FFD700 50%,#D4A017 100%);box-shadow:0 0 16px rgba(255,220,0,.9),0 0 32px rgba(255,160,0,.5);animation:pPulse 1.5s ease-in-out infinite;}
@keyframes pPulse{0%,100%{box-shadow:0 0 12px rgba(255,220,0,.8),0 0 24px rgba(255,160,0,.4);}50%{box-shadow:0 0 22px rgba(255,240,0,1),0 0 44px rgba(255,200,0,.8),0 0 60px rgba(255,100,0,.3);}}
.wheel-label{font-family:'Barlow Condensed',sans-serif;font-size:clamp(12px,1.8vw,15px);font-weight:900;color:rgba(255,210,100,.8);letter-spacing:3px;text-transform:uppercase;animation:wlPulse 1.5s ease-in-out infinite;text-shadow:0 0 20px rgba(212,160,23,.6);}
@keyframes wlPulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* ═══ REVEAL BTN ═══ */
#reveal-btn-wrap{display:none;position:fixed;bottom:0;left:0;right:0;height:50vh;align-items:center;justify-content:center;z-index:100;pointer-events:none;}
#reveal-btn-wrap.show{display:flex;}
#reveal-btn{pointer-events:all;padding:18px 52px;border-radius:60px;border:none;background:linear-gradient(135deg,#FFD700 0%,#FFF4CC 40%,#DAA520 100%);color:#020A1A;font-family:'Russo One',sans-serif;font-size:clamp(16px,2.5vw,24px);letter-spacing:2px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(255,215,0,.6);animation:rPop .5s cubic-bezier(.34,1.56,.64,1) both,rGlow 2.4s ease-in-out .5s infinite;transition:transform .25s,box-shadow .25s;text-shadow:0 2px 8px rgba(255,255,255,.4);}
@keyframes rPop{0%{transform:scale(.5) translateY(40px);opacity:0;}70%{transform:scale(1.08) translateY(-6px);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
@keyframes rGlow{0%,100%{box-shadow:0 0 0 4px rgba(212,160,23,.15),0 8px 32px rgba(212,100,0,.55);}50%{box-shadow:0 0 0 14px rgba(212,160,23,.08),0 12px 55px rgba(212,100,0,.8),0 0 100px rgba(212,160,23,.45);}}
#reveal-btn:hover{transform:translateY(-6px) scale(1.06);box-shadow:0 12px 40px rgba(255,215,0,0.8),inset 0 0 10px rgba(255,255,255,0.5);}
#reveal-btn:active{transform:translateY(2px) scale(0.95);box-shadow:0 2px 10px rgba(255,215,0,0.4),inset 0 4px 10px rgba(0,0,0,0.3);animation:none;}
#reveal-btn::before{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:rgba(255,255,255,.28);transform:skewX(-22deg);animation:sheen 3.5s ease-in-out infinite;}

/* ═══ MODAL ═══ */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:500;align-items:center;justify-content:center;padding:14px;}
#modal-overlay.open{display:flex;}
.modal{position:relative;background:linear-gradient(145deg,rgba(15,23,42,0.98),rgba(2,6,23,0.99));border:2px solid #D4A017;border-color:#FFD700 #D4A017 #B8860B #FFE680;border-radius:28px;padding:26px 26px 20px;width:min(96vw,940px);max-height:94vh;overflow:hidden auto;box-shadow:0 40px 100px rgba(0,0,0,0.9),0 0 40px rgba(212,160,23,0.2),inset 0 0 20px rgba(255,215,0,0.1);animation:mIn .45s cubic-bezier(.34,1.4,.64,1);}
.modal::before{content:'';position:absolute;top:0;left:-60%;right:-60%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,160,23,.6) 35%,rgba(255,220,100,.9) 50%,rgba(212,160,23,.6) 65%,transparent);}
@keyframes mIn{0%{transform:scale(.82) translateY(50px);opacity:0;}70%{transform:scale(1.02) translateY(-3px);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(20px,3.2vw,30px);background:linear-gradient(135deg,#FFD966,#fff,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1.5px;text-shadow:0 0 20px rgba(212,160,23,0.4);}
.modal-close{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(212,160,23,.5);background:rgba(212,160,23,.1);color:var(--gold-lt);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.modal-close:hover{background:rgba(212,160,23,.3);border-color:#FFD700;color:#fff;transform:scale(1.15) rotate(90deg);}

/* ── SINGLE WINNER CARD ── */
.winner-single{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0;}
.winner-big-num{font-family:'Russo One',sans-serif;font-size:clamp(56px,9vw,90px);background:linear-gradient(135deg,#FFD966,#D4A017,#FF6B00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;animation:nPop .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes nPop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
.winner-trophy{font-size:54px;animation:tSway 2s ease-in-out infinite;}
@keyframes tSway{0%,100%{transform:rotate(-5deg) scale(1);}50%{transform:rotate(5deg) scale(1.1);}}
.winner-card-single{background:linear-gradient(135deg,rgba(212,160,23,.12),rgba(255,100,0,.06));border:1.5px solid rgba(212,160,23,.35);border-radius:18px;padding:26px 38px;text-align:center;width:100%;max-width:600px;animation:cSlide .4s cubic-bezier(.34,1.2,.64,1) both;box-shadow:0 0 30px rgba(212,160,23,.1),inset 0 1px 0 rgba(255,200,80,.1);}
@keyframes cSlide{0%{transform:translateY(18px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.w-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(32px,5vw,50px);font-weight:900;color:#fff;letter-spacing:1px;}
.w-mobile{font-size:clamp(18px,2.5vw,24px);color:rgba(255,220,120,.75);font-weight:700;margin-top:6px;}
.w-loc{font-family:'Barlow Condensed',sans-serif;font-size:clamp(18px,2.5vw,24px);font-weight:900;color:rgba(212,160,23,.85);letter-spacing:.8px;margin-top:3px;}

/* ── WINNERS TABLE (3rd & Consolation) ── */
.winners-table{width:100%;border-collapse:separate;border-spacing:0 6px;}
.winners-table thead th{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(13px,1.8vw,17px);letter-spacing:2px;text-transform:uppercase;color:rgba(212,160,23,.65);padding:6px 12px 10px;text-align:left;border-bottom:1px solid rgba(212,160,23,.18);}
.winners-table tbody tr{background:rgba(255,215,0,.03);transition:background .25s,transform .25s;animation:cSlide .3s ease both;border-radius:12px;}
.winners-table tbody tr:hover{background:linear-gradient(100deg,rgba(212,160,23,.15),rgba(255,215,0,.05));transform:translateY(-2px);}
.winners-table tbody td{padding:13px 12px;font-size:clamp(14px,2vw,18px);color:rgba(255,255,255,.85);vertical-align:middle;border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(0,0,0,.1);}
.winners-table tbody td:first-child{border-radius:10px 0 0 10px;border-left:1px solid rgba(255,255,255,.04);}
.winners-table tbody td:last-child{border-radius:0 10px 10px 0;border-right:1px solid rgba(255,255,255,.04);}
.row-num{width:38px;height:38px;border-radius:50%;background:rgba(212,160,23,.12);border:1.5px solid rgba(212,160,23,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:rgba(212,160,23,.85);}
.winners-table tbody tr:hover .row-num{background:rgba(212,160,23,.22);border-color:rgba(212,160,23,.7);color:var(--gold-lt);}
.td-name{font-family:'Barlow Condensed',sans-serif;font-size:clamp(17px,2.4vw,22px);font-weight:900;color:rgba(255,255,255,.92);}
.td-mobile{color:rgba(255,220,120,.7);font-weight:700;font-size:clamp(14px,1.9vw,17px);}
.td-district{font-weight:700;color:rgba(255,255,255,.6);font-size:clamp(14px,1.9vw,17px);}
.td-state{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(15px,2vw,18px);letter-spacing:.5px;color:rgba(212,160,23,.8);}
/* Top winner highlight */
.winners-table tbody tr.top-win{background:linear-gradient(100deg,rgba(212,160,23,.15),rgba(255,100,0,.07));}
.winners-table tbody tr.top-win .row-num{background:linear-gradient(135deg,#D4A017,#FFD966);border-color:var(--gold-lt);color:#020A1A;}

function drawWheel(cv,angle){
  const ctx=cv.getContext('2d'),S=cv.width,cx=S/2,cy=S/2,R=S/2-10;
  const ARC=(Math.PI*2)/NS;
  ctx.clearRect(0,0,S,S);

  oRim.addColorStop(0,'#FFD700');oRim.addColorStop(.5,'#D4A017');oRim.addColorStop(1,'#B8860B');

  /* Dark Purple Rim Body */
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,R+10,0,Math.PI*2);
  ctx.fillStyle='#230b42';ctx.fill();
  ctx.restore();

  /* Rim dots */
  for(let d=0;d<30;d++){
    const da=angle+(d/30)*Math.PI*2;
    const dx=cx+Math.cos(da)*(R+5),dy=cy+Math.sin(da)*(R+5);
    ctx.save();ctx.shadowColor='rgba(255,255,200,1)';ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(dx,dy,2.5,0,Math.PI*2);
    ctx.fillStyle='#FFFFFF';ctx.fill();
    ctx.shadowBlur=5;ctx.beginPath();ctx.arc(dx,dy,1.5,0,Math.PI*2);
    ctx.fillStyle='#FFFFF0';ctx.fill();ctx.restore();
  }

  /* Inner gold ring */
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(255,215,0,.8)';ctx.lineWidth=3;ctx.stroke();ctx.restore();

  /* Segments */
  for(let i=0;i<NS;i++){
    const start=angle+i*ARC-Math.PI/2,end=start+ARC;
    ctx.save();
    
    // Segment background
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    grd.addColorStop(0,SEGS[i].light);grd.addColorStop(.55,SEGS[i].color);grd.addColorStop(1,dk(SEGS[i].color,55));
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,start,end);ctx.closePath();
    ctx.fillStyle=grd;ctx.fill();
    
    // Stardust Texture
    ctx.clip(); // Restrict stardust to just this segment
    for(let s=0;s<35;s++){
      const rDist = (Math.sin(i*20 + s*45)*0.5+0.5) * R;
      const rAng = start + (Math.cos(i*30 + s*15)*0.5+0.5) * ARC;
      const stX = cx + Math.cos(rAng)*rDist;
      const stY = cy + Math.sin(rAng)*rDist;
      ctx.beginPath();ctx.arc(stX,stY,Math.random()*1.2,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.6+0.1)+')';
      ctx.fill();
    }
    
    // Sheen
    const shGrd=ctx.createLinearGradient(cx+Math.cos(start)*R*.3,cy+Math.sin(start)*R*.3,cx+Math.cos(end)*R*.3,cy+Math.sin(end)*R*.3);
    shGrd.addColorStop(0,'rgba(255,255,255,.22)');shGrd.addColorStop(.5,'rgba(255,255,255,.06)');shGrd.addColorStop(1,'rgba(0,0,0,.1)');
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,start,end);ctx.closePath();ctx.fillStyle=shGrd;ctx.fill();
    ctx.restore();
    
    // Divider
    ctx.save();ctx.shadowColor='rgba(255,240,100,.5)';ctx.shadowBlur=4;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(start)*R,cy+Math.sin(start)*R);
    ctx.strokeStyle='rgba(255,230,80,.8)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }

  // Center Hub is now an HTML element (.wheel-center-btn)
}

function dk(hex,a){const n=parseInt(hex.slice(1),16);return`rgb(${Math.max(0,((n>>16)&0xff)-a)},${Math.max(0,((n>>8)&0xff)-a)},${Math.max(0,(n&0xff)-a)})`;}

function spinWheel(){
  if(spinning)return;spinning=true;
  document.getElementById('wheel-label').textContent='🎰 SPINNING...';
  const cv=document.getElementById('wheel-canvas');
  const total=(Math.PI*2)*(6+Math.random()*5);
  const dur=4800,t0=performance.now(),a0=wheelAngle;
  const SEGARC=(Math.PI*2)/NS;let lastSeg=Math.floor(a0/SEGARC);
  function ease(t){return 1-Math.pow(1-t,4);}
  function frame(now){
    const el=Math.min(now-t0,dur),t=el/dur;
    wheelAngle=a0+total*ease(t);
    const seg=Math.floor(wheelAngle/SEGARC);
    if(seg!==lastSeg){lastSeg=seg;if(window.LuckyAudio)LuckyAudio.tick();}
    drawWheel(cv,wheelAngle);
    if(el<dur)requestAnimationFrame(frame);
    else{spinning=false;onEnd();}
  }
  requestAnimationFrame(frame);
}

function onEnd(){
  if(window.LuckyAudio)LuckyAudio.ding();
  /* Simple clean completion — just update label and show reveal button after short delay */
  document.getElementById('wheel-label').textContent='🎉 SPIN COMPLETE!';
  
  if(window.confetti) {
    const duration = 3000, end = Date.now() + duration;
    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FFD700', '#00BCD4', '#FF4081'] });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FFD700', '#00BCD4', '#FF4081'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    }());
  }

  setTimeout(()=>{
    const wz=document.getElementById('wheel-zone');
    wz.style.transition='opacity .6s';wz.style.opacity='0';
    document.body.classList.remove('spin-mode');
    setTimeout(()=>{
      wz.classList.remove('active');wz.style.opacity='1';wz.style.transition='';
      document.getElementById('reveal-btn-wrap').classList.add('show');
      document.getElementById('div-label').textContent='✦ Winners Ready! ✦';
    },600);
  }, 2500);
}

/* ══ CSV + CAROUSEL ══ */
let allWinners=[],currentPage=1;
const PAGE_SIZE=prize.pageSize;

async function openModal(){
  if(window.LuckyAudio)LuckyAudio.fanfare();
  try{
    const { data, error } = await supabase
        .from('draw_winners')
        .select('*')
        .eq('prize_tier', prize.tier);

    if (error) throw error;
    
    // Map database rows to the carousel format
    allWinners = data.map(row => ({
        name: row.customer_name || '',
        mobile: row.customer_code || '',
        district: row.territory || '',
        state: row.region || ''
    }));
    
    if (allWinners.length === 0) {
        throw new Error("No winners found in database for " + prize.tier);
    }
  }catch(e){
    console.error("Database Fetch Error:", e);
    allWinners=demoData();
  }
  currentPage=1;render();
  document.getElementById('modal-overlay').classList.add('open');
  if(window.LuckyAudio){LuckyAudio.duck(true);setTimeout(()=>LuckyAudio.celebrate(),350);}
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  if(window.LuckyAudio)LuckyAudio.duck(false);
}

function demoData(){
  const n=['Ramesh Kumar','Suresh Patel','Priya Sharma','Mohan Reddy','Anita Devi','Ravi Shankar','Sunita Yadav','Ajay Singh','Meena Kumari','Dinesh Gowda','Lakshmi Bai','Arjun Rao'];
  const d=['Nashik','Ahmedabad','Jaipur','Hyderabad','Lucknow','Patna','Bhopal','Chandigarh','Mysuru','Pune','Nagpur','Coimbatore'];
  const s=['Maharashtra','Gujarat','Rajasthan','Telangana','Uttar Pradesh','Bihar','Madhya Pradesh','Punjab','Karnataka','Maharashtra','Maharashtra','Tamil Nadu'];
  return Array.from({length:Math.max(PAGE_SIZE*3,12)},(_,i)=>({name:n[i%n.length],mobile:`98${String(76543210+i*111).padStart(8,'0')}`,district:d[i%d.length],state:s[i%s.length]}));
}

function render(){
  const total=allWinners.length;
  const totalPages=Math.ceil(total/PAGE_SIZE)||1;
  const start=(currentPage-1)*PAGE_SIZE;
  const pageData=allWinners.slice(start,start+PAGE_SIZE);
  const cc=document.getElementById('carousel-content');

  if(PAGE_SIZE===1){
    /* Single winner card */
    const w=pageData[0]||{};
    cc.innerHTML=`<div class="winner-single">
      <div class="winner-trophy">🏆</div>
      <div class="winner-big-num">#${start+1}</div>
      <div class="winner-card-single">
        <div class="w-name">${w.name||'—'}</div>
        <div class="w-mobile">📱 ${w.mobile||'—'}</div>
        <div class="w-loc">📍 ${w.district||'—'}, ${w.state||'—'}</div>
      </div>
    </div>`;
    document.getElementById('page-label').textContent='Winner';
    document.getElementById('page-num').textContent=currentPage;
    document.getElementById('page-of').textContent=`of ${totalPages}`;
  } else {
    /* Table format for 3rd and Consolation */
    let rows=pageData.map((w,i)=>{
      const n=start+i+1,isTop=(n===1&&currentPage===1);
      return `<tr class="${isTop?'top-win':''}">
        <td><div class="row-num">${n}</div></td>
        <td><div class="td-name">${w.name}</div></td>
        <td><div class="td-mobile">${w.mobile}</div></td>
        <td><div class="td-district">${w.district}</div></td>
        <td><div class="td-state">${w.state}</div></td>
      </tr>`;
    }).join('');
    cc.innerHTML=`<table class="winners-table">
      <thead><tr><th>#</th><th>Name</th><th>Mobile</th><th>District</th><th>State</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
    const rangeEnd=Math.min(start+PAGE_SIZE,total);
    document.getElementById('page-label').textContent=`Winners ${start+1}–${rangeEnd} of ${total}`;
    document.getElementById('page-num').textContent=currentPage;
    document.getElementById('page-of').textContent=`of ${totalPages}`;
  }

  document.getElementById('prev-btn').disabled=currentPage===1;
  document.getElementById('next-btn').disabled=currentPage>=totalPages;
}

function changePage(d){
  const tp=Math.ceil(allWinners.length/PAGE_SIZE)||1;
  const np=Math.max(1,Math.min(tp,currentPage+d));
  if(np!==currentPage&&window.LuckyAudio)LuckyAudio.page();
  currentPage=np;
  render();
}

document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
</script>
